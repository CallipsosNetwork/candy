[package]
name = "candy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "candy spec language linter and toolchain"

[[bin]]
name = "candy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
