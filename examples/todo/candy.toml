[project]
name    = "todo"
version = "0.1.0"

[candy]
runtime = "0.1"

[targets.go]
language  = "go"
framework = "chi"

[targets.rust]
language  = "rust"
framework = "axum"

[targets.typescript]
language  = "typescript"
framework = "hono"

[targets.python]
language  = "python"
framework = "fastapi"

[deps]
"candy/grammar"      = "0.1"
"candy/codegen-go"   = "0.1"
"candy/codegen-rust" = "0.1"
"candy/codegen-ts"   = "0.1"
"candy/codegen-py"   = "0.1"
